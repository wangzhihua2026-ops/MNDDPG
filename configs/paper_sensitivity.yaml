project:
  name: mnddpg_experiment_project
  seed: 3407

method:
  name: MNDDPG
  mode: paper_sensitivity

federated:
  num_clients: 6
  rounds: 8
  local_steps: 96
  local_updates: 8
  clip_norm: 1.75

agent:
  batch_size: 32
  gating_temperature: 0.8
  route_temperature: 0.45

sensitivity:
  clip_norm_values: 1.0,1.75,2.5,3.5
  gating_temperature_values: 1.0,0.8,0.45,0.2

evaluation:
  steps: 200
  scenario_limit: 30

output:
  log_dir: outputs/logs
  checkpoint_dir: outputs/checkpoints
  result_dir: outputs/results
  figure_dir: outputs/figures
  table_dir: outputs/tables
