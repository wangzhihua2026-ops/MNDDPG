project:
  name: mnddpg_experiment_project
  seed: 3407
  device: cpu

method:
  name: MNDDPG
  mode: paper_main

simulator:
  dataset: generated_iiot_offloading
  split_seed: 3407
  external_dataset: false

federated:
  num_clients: 6
  rounds: 20
  local_steps: 128
  local_updates: 8
  clip_norm: 1.75

agent:
  batch_size: 32
  gating_temperature: 0.8
  route_temperature: 0.45

evaluation:
  mode: seen
  steps: 200
  scenario_limit: 30
  bootstrap_resamples: 2000

output:
  log_dir: outputs/logs
  checkpoint_dir: outputs/checkpoints
  result_dir: outputs/results
  figure_dir: outputs/figures
  table_dir: outputs/tables
